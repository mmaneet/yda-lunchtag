{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>History</h2>
  {% if sessions %}
  <table>
    <thead>
      <tr><th>Date</th><th>Score</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for session in sessions %}
        <tr>
          <td>{{ session.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
          <td>{{ '%.2f'|format(session.score) }}</td>
          <td><a href="{{ url_for('history_detail', session_id=session.id) }}">View</a></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p class="muted">No confirmed sessions yet.</p>
  {% endif %}
</section>
{% endblock %}
