{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Sign in</h2>
  <p class="muted">Use your Yale (yale.edu) Google account to access the YDA member portal.</p>
  <div class="actions">
    <form action="{{ url_for('auth.google_login') }}" method="get">
      <button type="submit">Sign in with Google</button>
    </form>
    {% if config.DUMMY_LOGIN_EMAIL %}
    <form action="{{ url_for('auth.dummy_login') }}" method="post">
      <button class="ghost" type="submit">Dummy login ({{ config.DUMMY_LOGIN_EMAIL }})</button>
    </form>
    {% endif %}
  </div>
</section>
{% endblock %}
